apiVersion: apps/v1
kind: Deployment
metadata:
  name: dockerexample-app-deployment
  labels:
    app: dockerexample-app
spec:
  replicas: 2 
  selector:
    matchLabels:
      app: dockerexample-app
  template:
    metadata:
      labels:
        app: dockerexample-app
    spec:
      containers:
      - name: dockerexample-container
        # 1. MUST ADD YOUR DOCKER HUB USERNAME HERE
        image: shivam843104/dockerexample-app:latest
        # 2. Changed so ArgoCD can pull the new images from Docker Hub
        imagePullPolicy: Always 
        ports:
        - containerPort: 3000
        env:
        # 3. Tells your Node app how to find the Mongo service inside Minikube
        - name: MONGO_URL 
          value: "mongodb://mongo-service:27017/mydatabase"
        - name: PORT
          value: "3000"
---
apiVersion: v1
kind: Service
metadata:
  name: dockerexample-app-service
spec:
  type: NodePort 
  selector:
    app: dockerexample-app
  ports:
    - protocol: TCP
      port: 80         
      targetPort: 3000 
      nodePort: 30001